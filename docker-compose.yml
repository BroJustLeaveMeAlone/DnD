name: ttrpg-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ttrpg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ttrpg_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ttrpg}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ttrpg} -d ${POSTGRES_DB:-ttrpg}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
